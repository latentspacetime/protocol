name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration
        run: ./scripts/check.zsh
      - name: Shell behavior tests
        run: ./tests/shell_test.zsh
